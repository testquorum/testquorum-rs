[package]
name = "testquorum-runner"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
testquorum-config = { path = "../testquorum-config" }
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
which = "7"
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "sync"] }
tokio-stream = "0.1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
