name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: macos-26
            arch: aarch64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Nix
        uses: cachix/install-nix-action@fd24c48048070c1be9acd18c9d369a83f0fe94d7 # v31

      - name: Setup Nix S3 cache
        uses: lemmih/nix-s3-cache-action@29264f2f7ee0569b80a4c91ef27734c92ac69026 # v1
        with:
          s3-endpoint: ba58a56742691d9efc310cca51093d04.r2.cloudflarestorage.com
          bucket: testquorum-nix-public
          region: auto
          aws-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          public-key: "nixcache.testquorum.dev-1:w8eYAwlsCrkOoPWvRFZa/haM19qkHu0kAHD0zkGN+0g="
          private-key: ${{ secrets.NIX_SIGNING_KEY }}

      - name: Enter CI devShell
        uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1
        with:
          arguments: .#ci

      - name: Build binary
        run: |
          if [ "${{ matrix.os }}" = "macos-26" ]; then
            nix build .#testquorum-runner --out-link result
            ls -la result/bin/
          else
            nix build .#testquorum-runner-static --out-link result
            ls -la result/
          fi

      - name: Upload to R2
        run: |
          ARCH="${{ matrix.arch }}"
          COMMIT_SHA="${{ github.sha }}"
          
          if [ "${{ matrix.os }}" = "macos-26" ]; then
            # Darwin: compress the regular binary
            SOURCE_FILE="result/bin/testquorum-runner"
            TEMP_FILE="/tmp/testquorum-runner-${ARCH}.zst"
            zstd -19 --long --force --no-progress -o "${TEMP_FILE}" "${SOURCE_FILE}"
            SOURCE_FILE="${TEMP_FILE}"
          else
            # Linux: use pre-compressed static binary
            SOURCE_FILE="result/testquorum-runner-${ARCH}.zst"
          fi
          
          DEST_PATH="s3://testquorum-assets/binaries/testquorum-runner/${COMMIT_SHA}/testquorum-runner-${ARCH}.zst"
          
          echo "Uploading ${SOURCE_FILE} to ${DEST_PATH}"
          aws s3 cp "${SOURCE_FILE}" "${DEST_PATH}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://ba58a56742691d9efc310cca51093d04.r2.cloudflarestorage.com
          AWS_REGION: auto
