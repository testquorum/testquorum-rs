name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Nix
        uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1

      - name: Setup Nix S3 cache
        uses: testquorum/nix-s3-generations@45aa2ff2b0df67b5f48a1b710c574c754f08a0c7 # v0.1.4
        with:
          s3-endpoint: ba58a56742691d9efc310cca51093d04.r2.cloudflarestorage.com
          bucket: testquorum-nix-public
          region: auto
          aws-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          public-key: "nixcache.testquorum.dev-1:aS+CJF8O8Ebirc6hypMfq/061h5TJlbsej1+zUJHPec="
          private-key: ${{ secrets.NIX_SIGNING_KEY }}

      - name: Enter CI devShell
        uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1
        with:
          arguments: .#ci

      - name: Build static binary
        run: |
          nix build .#testquorum-runner-static --out-link result
          ls -la result/

      - name: Upload to R2
        run: |
          ARCH="${{ matrix.os == 'ubuntu-24.04-arm' && 'aarch64' || 'x86_64' }}"
          COMMIT_SHA="${{ github.sha }}"
          SOURCE_FILE="result/testquorum-runner-${ARCH}.zst"
          DEST_PATH="s3://testquorum-assets/binaries/testquorum-runner/${COMMIT_SHA}/testquorum-runner-${ARCH}.zst"
          
          echo "Uploading ${SOURCE_FILE} to ${DEST_PATH}"
          aws s3 cp "${SOURCE_FILE}" "${DEST_PATH}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://ba58a56742691d9efc310cca51093d04.r2.cloudflarestorage.com
          AWS_REGION: auto
