name: Publish crates

on:
  push:
    branches: [ main ]
    paths:
      - 'src/testquorum-api/Cargo.toml'

# Trusted Publishing needs id-token; contents:read to checkout.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: crates-io
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Merge queue squashes to a single commit, so the push is always one
          # commit and HEAD~1 is the version we're diffing against.
          fetch-depth: 2

      - name: Install Nix
        uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1

      - name: Enter CI devShell
        uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1
        with:
          arguments: .#ci

      - name: Detect version change
        id: ver
        run: |
          pkg=testquorum-api
          query='.packages[] | select(.name==$p) | .version'
          version() { cargo metadata --format-version 1 --no-deps | jq -r --arg p "$pkg" "$query"; }

          new=$(version)
          git switch --detach HEAD~1
          old=$(version)
          git switch --detach "${{ github.sha }}"  # back to the pushed commit

          echo "old=$old new=$new"
          if [ -n "$new" ] && [ "$new" != "$old" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to crates.io (Trusted Publishing)
        if: steps.ver.outputs.changed == 'true'
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        if: steps.ver.outputs.changed == 'true'
        run: cargo publish -p testquorum-api
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
