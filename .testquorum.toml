[managers.nix]
attrset = "ci"

# Dogfood the cargo backend's prebuilt-archive mode: the runner builds the
# workspace's nextest archive straight from this flake output (per-system, so
# ${SYSTEM} is expanded to the current Nix system), so tests are discovered and
# run from the reproducible Nix build rather than recompiled locally.
[managers.cargo]
nextest_archive = "nix://.#ci.${SYSTEM}.testquorum-nextest-archive"

[cloud]
required = true
max_wait_seconds = 60
